services:
  restmesh:
    image: ghcr.io/frnmst/restmesh:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    devices:
      # Pass the Meshtastic device on the left hand side. Keep `/dev/ttyUSB0`
      # on the right.
      - '/dev/ttyUSB0:/dev/ttyUSB0'
    ports:
      - '0.0.0.0:8000:8000'
    group_add:
      # Pass the correct group that has access to modem devices.
      - 'dialout'
